services:
  - type: web
    name: painel-ocorrencias
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ocorrencias-db
          property: connectionString
      - key: ADMIN_USER
        sync: false        # você define no painel do Render
      - key: ADMIN_PASSWORD
        sync: false        # você define no painel do Render
      - key: TOKEN_SECRET
        generateValue: true

databases:
  - name: ocorrencias-db
    plan: free
