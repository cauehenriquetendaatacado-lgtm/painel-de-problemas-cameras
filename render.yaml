services:
  - type: web
    name: painel-ocorrencias
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ocorrencias-db
          property: connectionString
      - key: ADMIN_USER
        value: Caue        # usuário do admin
      - key: ADMIN_PASSWORD
        sync: false        # você define a senha no painel do Render
      - key: USER_LOGIN
        sync: false        # (opcional) usuário já aprovado, sem precisar de cadastro
      - key: USER_PASSWORD
        sync: false        # senha desse usuário, você define no painel do Render
      - key: TOKEN_SECRET
        generateValue: true

databases:
  - name: ocorrencias-db
    plan: free
