<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dashboard · Caue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0b5fa5">
<link rel="manifest" href="/manifest-admin.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<style>
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;text-align:left;cursor:pointer;border-top:4px solid var(--line)}
.kpi[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kpi b{display:block;font-size:1.9rem;line-height:1.1}
.kpi span{color:var(--muted);font-size:.85rem;font-weight:400}
.kpi.k-pend{border-top-color:var(--andamento)}.kpi.k-urg{border-top-color:var(--aberta)}.kpi.k-ok{border-top-color:var(--resolvida)}.kpi.k-ct{border-top-color:var(--accent)}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
@media(max-width:820px){.panels{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.panel h2{font-size:.95rem;margin:0 0 10px}
.bar{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:.85rem}
.bar i{display:block;height:10px;border-radius:5px;background:var(--accent);min-width:2px}
.bar .tr{background:var(--line);border-radius:5px;height:10px}
.cols{display:flex;gap:8px;align-items:flex-end;height:120px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.75rem;color:var(--muted)}
.cols i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.cols b{color:var(--ink);font-size:.8rem}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.novo{background:var(--aberta);color:#fff;border-color:var(--aberta)}
.tools select{flex:0 0 auto}
.sub{color:var(--muted);font-size:.9rem;margin:0}
</style>
</head>
<body>
<main class="wrap" id="login">
  <h1>Dashboard do administrador</h1>
  <p class="lead">Entre com seu usuário e senha de administrador.</p>
  <form id="lf" class="card">
    <label for="usuario">Usuário</label>
    <input id="usuario" autocomplete="username" autocapitalize="none" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <button class="primary full">Entrar</button>
    <div id="lmsg" role="status" aria-live="polite"></div>
  </form>
</main>

<main class="wrap wide" id="app" hidden>
  <div class="top">
    <div><h1>Dashboard</h1><p class="sub">Olá, Caue · atualizado às <span id="hora">--</span></p></div>
    <div class="actions"><button id="reload">Atualizar</button><button id="sair">Sair</button></div>
  </div>

  <div class="kpis" id="kpis"></div>
  <div class="panels">
    <div class="panel"><h2>Chamados por categoria</h2><div id="g-cat"></div></div>
    <div class="panel"><h2>Chamados nos últimos 7 dias</h2><div class="cols" id="g-dias"></div></div>
  </div>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-oc" aria-selected="true">Chamados</button>
    <button type="button" role="tab" id="tab-ct" aria-selected="false">Contas <span id="badge"></span></button>
  </div>

  <section id="sec-contas" hidden>
    <p class="lead">Aprove ou recuse quem pediu cadastro. Só contas aprovadas enviam chamados.</p>
    <div id="contas"></div>
  </section>

  <section id="sec-oc">
    <div class="tools">
      <input id="busca" type="search" placeholder="Buscar por nome, local, texto ou nº" aria-label="Buscar">
      <select id="fs" aria-label="Situação"><option value="">Todas as situações</option><option value="pend">Pendentes</option><option value="aberta">Abertas</option><option value="em_andamento">Em andamento</option><option value="urg">Urgentes</option><option value="resolvida">Concluídas</option></select>
      <select id="cat" aria-label="Categoria"><option value="">Todas as categorias</option><option>Segurança</option><option>Manutenção</option><option>Limpeza</option><option>Barulho</option><option>Outros</option></select>
      <select id="ord" aria-label="Ordenar"><option value="rec">Mais recentes</option><option value="urg">Mais urgentes</option></select>
    </div>
    <div id="lista" aria-live="polite"></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const NOME = { aberta: 'Aberta', em_andamento: 'Em andamento', resolvida: 'Concluída' };
const CATS = ['Segurança', 'Manutenção', 'Limpeza', 'Barulho', 'Outros'];
let token = sessionStorage.getItem('tk') || '';
let dados = [], contas = [], filtro = '';

async function api(url, opt = {}) {
  const r = await fetch(url, { ...opt, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opt.headers || {}) } });
  if (r.status === 401 && token && !url.includes('/login')) { sair(); throw new Error('Sessão expirada. Entre novamente.'); }
  if (r.status === 204) return null;
  const j = await r.json();
  if (!r.ok) throw new Error(j.erro || 'Erro');
  return j;
}
function sair() { token = ''; sessionStorage.removeItem('tk'); $('#app').hidden = true; $('#login').hidden = false; document.title = 'Dashboard · Caue'; }
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const data = (d) => new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });

$('#lf').addEventListener('submit', async (e) => {
  e.preventDefault();
  const m = $('#lmsg'); m.className = ''; m.textContent = '';
  try {
    const j = await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ usuario: $('#usuario').value, senha: $('#senha').value }) });
    token = j.token; sessionStorage.setItem('tk', token); $('#senha').value = ''; abrir();
  } catch (err) { m.className = 'msg erro'; m.textContent = err.message; }
});
$('#sair').onclick = sair;
$('#reload').onclick = tudo;
$('#tab-oc').onclick = () => aba(true);
$('#tab-ct').onclick = () => aba(false);
['busca', 'cat', 'ord'].forEach((id) => $('#' + id).addEventListener('input', lista));
$('#fs').addEventListener('input', () => { filtro = $('#fs').value; render(); });

function aba(oc) {
  $('#sec-oc').hidden = !oc; $('#sec-contas').hidden = oc;
  $('#tab-oc').setAttribute('aria-selected', oc); $('#tab-ct').setAttribute('aria-selected', !oc);
}
async function abrir() { $('#login').hidden = true; $('#app').hidden = false; await tudo(); }
async function tudo() {
  try { [dados, contas] = await Promise.all([api('/api/admin/ocorrencias'), api('/api/admin/usuarios')]); $('#hora').textContent = new Date().toLocaleTimeString('pt-BR', { timeStyle: 'short' }); render(); }
  catch (err) { $('#lista').innerHTML = '<div class="msg erro"></div>'; $('#lista div').textContent = err.message; }
}

const pendente = (o) => o.status !== 'resolvida';
function render() {
  const pend = dados.filter(pendente), urg = pend.filter((o) => o.prioridade === 'alta');
  const novas = contas.filter((c) => c.status === 'pendente').length;
  const K = [['', dados.length, 'Total de chamados', ''], ['pend', pend.length, 'Pendentes', 'k-pend'], ['urg', urg.length, 'Urgentes pendentes', 'k-urg'], ['resolvida', dados.length - pend.length, 'Concluídos', 'k-ok']];
  $('#kpis').innerHTML = K.map(([f, n, t, c]) => `<button class="kpi ${c}" data-f="${f}" aria-pressed="${filtro === f}"><b>${n}</b><span>${t}</span></button>`).join('') +
    `<button class="kpi k-ct" id="kct"><b>${novas}</b><span>Contas aguardando</span></button>`;
  document.querySelectorAll('.kpi[data-f]').forEach((b) => b.onclick = () => { filtro = b.dataset.f; $('#fs').value = filtro; aba(true); render(); });
  $('#kct').onclick = () => aba(false);
  $('#badge').textContent = novas ? '(' + novas + ' novo' + (novas > 1 ? 's' : '') + ')' : '';
  document.title = (pend.length ? '(' + pend.length + ') ' : '') + 'Dashboard · Caue';

  const max = Math.max(1, ...CATS.map((c) => dados.filter((o) => o.categoria === c).length));
  $('#g-cat').innerHTML = CATS.map((c) => {
    const t = dados.filter((o) => o.categoria === c), p = t.filter(pendente).length;
    return `<div class="bar"><span>${c}</span><div class="tr"><i style="width:${t.length / max * 100}%"></i></div><span>${t.length}${p ? ' · ' + p + ' pend.' : ''}</span></div>`;
  }).join('');

  const dias = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); return d; });
  const chave = (d) => new Date(d).toLocaleDateString('en-CA');
  const cont = dias.map((d) => dados.filter((o) => chave(o.criada_em) === chave(d)).length), mx = Math.max(1, ...cont);
  $('#g-dias').innerHTML = dias.map((d, i) => `<div><b>${cont[i]}</b><i style="height:${cont[i] / mx * 80}%"></i>${d.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '')}</div>`).join('');

  lista(); renderContas();
}

function lista() {
  const q = $('#busca').value.toLowerCase(), c = $('#cat').value, ord = $('#ord').value;
  let l = dados.filter((o) =>
    (!filtro || (filtro === 'pend' ? pendente(o) : filtro === 'urg' ? pendente(o) && o.prioridade === 'alta' : o.status === filtro)) &&
    (!c || o.categoria === c) &&
    (!q || [o.nome, o.usuario, o.local, o.descricao, o.contato, String(o.id)].join(' ').toLowerCase().includes(q)));
  if (ord === 'urg') { const pr = { alta: 0, media: 1, baixa: 2 }; l = [...l].sort((a, b) => (pendente(b) - pendente(a)) || (pr[a.prioridade] - pr[b.prioridade]) || (new Date(b.criada_em) - new Date(a.criada_em))); }

  $('#lista').innerHTML = l.length ? l.map((o) => {
    const novo = o.status === 'aberta' && Date.now() - new Date(o.criada_em) < 864e5;
    return `
    <article class="item ${o.status}" data-id="${o.id}">
      <header><h3>#${o.id} · ${esc(o.local)}</h3><span class="meta">${data(o.criada_em)}</span></header>
      <div class="meta">${novo ? '<span class="tag novo">Novo</span>' : ''}<span class="tag ${o.prioridade === 'alta' ? 'alta' : ''}">Urgência ${o.prioridade === 'media' ? 'média' : esc(o.prioridade)}</span><span class="tag">${esc(o.categoria)}</span>
        ${esc(o.nome)}${o.usuario ? ' (@' + esc(o.usuario) + ')' : ''}${o.contato ? ' · ' + esc(o.contato) : ''}</div>
      <p class="desc">${esc(o.descricao)}</p>
      <div class="actions">
        <select class="st" aria-label="Situação do chamado ${o.id}">${Object.keys(NOME).map((s) => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${NOME[s]}</option>`).join('')}</select>
        <button class="danger del">Excluir</button>
      </div>
      <div class="nota"><label for="n${o.id}" class="hint">Nota interna</label>
        <textarea id="n${o.id}" class="nt">${esc(o.nota_admin || '')}</textarea>
        <button class="salvar" style="margin-top:6px">Salvar nota</button></div>
    </article>`;
  }).join('') : '<div class="vazio">Nenhum chamado neste filtro.</div>';

  document.querySelectorAll('#lista .item').forEach((el) => {
    const id = el.dataset.id;
    el.querySelector('.st').onchange = (e) => atualizar(id, { status: e.target.value });
    el.querySelector('.salvar').onclick = () => atualizar(id, { nota_admin: el.querySelector('.nt').value });
    el.querySelector('.del').onclick = async () => {
      if (!confirm('Excluir o chamado #' + id + '? Isso não pode ser desfeito.')) return;
      await api('/api/admin/ocorrencias/' + id, { method: 'DELETE' });
      dados = dados.filter((o) => String(o.id) !== id); render();
    };
  });
}
async function atualizar(id, corpo) {
  try { const n = await api('/api/admin/ocorrencias/' + id, { method: 'PATCH', body: JSON.stringify(corpo) });
    dados = dados.map((o) => String(o.id) === String(id) ? { ...o, ...n } : o); render(); }
  catch (err) { alert(err.message); }
}

/* contas: aprovar / recusar */
const ST_CONTA = { pendente: 'Aguardando', aprovado: 'Aprovada', recusado: 'Recusada' };
function renderContas() {
  $('#contas').innerHTML = contas.length ? contas.map((c) => `
    <article class="item ${c.status === 'pendente' ? 'em_andamento' : c.status === 'aprovado' ? 'resolvida' : 'aberta'}" data-id="${c.id}">
      <header><h3>${esc(c.nome)} · @${esc(c.usuario)}</h3><span class="meta">${data(c.criado_em)}</span></header>
      <div class="meta"><span class="tag">${ST_CONTA[c.status] || esc(c.status)}</span></div>
      <div class="actions" style="margin-top:10px">
        ${c.status !== 'aprovado' ? '<button class="primary ok-c">Aprovar</button>' : ''}
        ${c.status === 'pendente' ? '<button class="no-c">Recusar</button>' : ''}
        ${c.status === 'aprovado' ? '<button class="no-c">Bloquear</button>' : ''}
        <button class="danger del-c">Excluir</button>
      </div></article>`).join('') : '<div class="vazio">Ninguém pediu cadastro ainda.</div>';
  document.querySelectorAll('#contas .item').forEach((el) => {
    const id = el.dataset.id;
    const mudar = async (status) => { try { const n = await api('/api/admin/usuarios/' + id, { method: 'PATCH', body: JSON.stringify({ status }) }); contas = contas.map((c) => String(c.id) === id ? n : c); render(); } catch (err) { alert(err.message); } };
    const ok = el.querySelector('.ok-c'), no = el.querySelector('.no-c');
    if (ok) ok.onclick = () => mudar('aprovado');
    if (no) no.onclick = () => mudar('recusado');
    el.querySelector('.del-c').onclick = async () => {
      if (!confirm('Excluir esta conta? Os chamados dela continuam salvos.')) return;
      await api('/api/admin/usuarios/' + id, { method: 'DELETE' });
      contas = contas.filter((c) => String(c.id) !== id); render();
    };
  });
}

if (token) abrir();
setInterval(() => {   // atualiza sozinho a cada 30 s, sem atrapalhar quem está digitando
  if (!token || $('#app').hidden || document.hidden) return;
  const a = document.activeElement;
  if (a && (a.classList.contains('nt') || a.id === 'busca')) return;
  tudo();
}, 30000);
</script>
<script src="/install.js"></script>
</body>
</html>
