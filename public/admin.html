<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel do Caue · Ocorrências</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0b5fa5">
<link rel="manifest" href="/manifest-admin.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap" id="login">
  <h1>Painel do administrador</h1>
  <p class="lead">Entre com seu usuário e senha de administrador.</p>
  <form id="lf" class="card">
    <label for="usuario">Usuário</label>
    <input id="usuario" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <button class="primary full">Entrar</button>
    <div id="lmsg" role="status" aria-live="polite"></div>
  </form>
</main>

<main class="wrap wide" id="app" hidden>
  <div class="top">
    <h1>Ocorrências</h1>
    <div class="actions"><button id="reload">Atualizar</button><button id="sair">Sair</button></div>
  </div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-oc" aria-selected="true">Ocorrências</button>
    <button type="button" role="tab" id="tab-ct" aria-selected="false">Contas <span id="badge"></span></button>
  </div>
  <section id="sec-contas" hidden>
    <p class="lead">Aprove ou recuse quem pediu cadastro. Só contas aprovadas conseguem enviar ocorrências.</p>
    <div id="contas"></div>
  </section>
  <section id="sec-oc">
  <div class="stats" id="stats"></div>
  <div class="tools">
    <input id="busca" type="search" placeholder="Buscar por nome, local ou texto" aria-label="Buscar">
    <select id="cat" aria-label="Categoria"><option value="">Todas as categorias</option>
      <option>Segurança</option><option>Manutenção</option><option>Limpeza</option><option>Barulho</option><option>Outros</option></select>
  </div>
  <div id="lista" aria-live="polite"></div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const NOMES = { aberta: 'Abertas', em_andamento: 'Em andamento', resolvida: 'Resolvidas' };
let token = sessionStorage.getItem('tk') || '';
let dados = [], filtroStatus = '';

async function api(url, opt = {}) {
  const r = await fetch(url, { ...opt, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opt.headers||{}) } });
  if (r.status === 401 && token) { sair(); throw new Error('Sessão expirada. Entre novamente.'); }
  if (r.status === 204) return null;
  const j = await r.json();
  if (!r.ok) throw new Error(j.erro || 'Erro');
  return j;
}
function sair() { token = ''; sessionStorage.removeItem('tk'); $('#app').hidden = true; $('#login').hidden = false; }

$('#lf').addEventListener('submit', async (e) => {
  e.preventDefault();
  const m = $('#lmsg'); m.className = ''; m.textContent = '';
  try {
    const j = await api('/api/admin/login', { method: 'POST', body: JSON.stringify({ usuario: $('#usuario').value, senha: $('#senha').value }) });
    token = j.token; sessionStorage.setItem('tk', token); $('#senha').value = '';
    abrir();
  } catch (err) { m.className = 'msg erro'; m.textContent = err.message; }
});
$('#sair').onclick = sair;
$('#reload').onclick = () => { carregar(); carregarContas(); };
['busca', 'cat'].forEach((id) => $('#' + id).addEventListener('input', render));

async function abrir() { $('#login').hidden = true; $('#app').hidden = false; await Promise.all([carregar(), carregarContas()]); }
async function carregar() {
  try { dados = await api('/api/admin/ocorrencias'); render(); }
  catch (err) { $('#lista').innerHTML = '<div class="msg erro"></div>'; $('#lista div').textContent = err.message; }
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const data = (d) => new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });

function render() {
  const cont = { aberta: 0, em_andamento: 0, resolvida: 0 };
  dados.forEach((o) => cont[o.status]++);
  $('#stats').innerHTML =
    `<button class="stat" data-s="" aria-pressed="${filtroStatus === ''}"><b>${dados.length}</b><span>Todas</span></button>` +
    Object.keys(NOMES).map((s) => `<button class="stat" data-s="${s}" aria-pressed="${filtroStatus === s}"><b>${cont[s]}</b><span>${NOMES[s]}</span></button>`).join('');
  document.querySelectorAll('.stat').forEach((b) => b.onclick = () => { filtroStatus = b.dataset.s; render(); });

  const q = $('#busca').value.toLowerCase(), c = $('#cat').value;
  const lista = dados.filter((o) =>
    (!filtroStatus || o.status === filtroStatus) && (!c || o.categoria === c) &&
    (!q || [o.nome, o.local, o.descricao, o.contato, String(o.id)].join(' ').toLowerCase().includes(q)));

  $('#lista').innerHTML = lista.length ? lista.map((o) => `
    <article class="item ${o.status}" data-id="${o.id}">
      <header>
        <h3>#${o.id} · ${esc(o.local)}</h3>
        <span class="meta">${data(o.criada_em)}</span>
      </header>
      <div class="meta"><span class="tag ${o.prioridade === 'alta' ? 'alta' : ''}">Urgência ${esc(o.prioridade === 'media' ? 'média' : o.prioridade)}</span><span class="tag">${esc(o.categoria)}</span>
        ${esc(o.nome)}${o.usuario ? ' (@' + esc(o.usuario) + ')' : ''}${o.contato ? ' · ' + esc(o.contato) : ''}</div>
      <p class="desc">${esc(o.descricao)}</p>
      <div class="actions">
        <select class="st" aria-label="Status da ocorrência ${o.id}">
          ${Object.keys(NOMES).map((s) => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${{aberta:'Aberta',em_andamento:'Em andamento',resolvida:'Resolvida'}[s]}</option>`).join('')}
        </select>
        <button class="danger del">Excluir</button>
      </div>
      <div class="nota">
        <label for="n${o.id}" class="hint">Nota interna</label>
        <textarea id="n${o.id}" class="nt">${esc(o.nota_admin || '')}</textarea>
        <button class="salvar" style="margin-top:6px">Salvar nota</button>
      </div>
    </article>`).join('') : '<div class="vazio">Nenhuma ocorrência neste filtro.</div>';

  document.querySelectorAll('.item').forEach((el) => {
    const id = el.dataset.id;
    el.querySelector('.st').onchange = (e) => atualizar(id, { status: e.target.value });
    el.querySelector('.salvar').onclick = () => atualizar(id, { nota_admin: el.querySelector('.nt').value });
    el.querySelector('.del').onclick = async () => {
      if (!confirm('Excluir a ocorrência #' + id + '? Isso não pode ser desfeito.')) return;
      await api('/api/admin/ocorrencias/' + id, { method: 'DELETE' });
      dados = dados.filter((o) => String(o.id) !== id); render();
    };
  });
}
/* ---------- contas (aprovar / recusar) ---------- */
let contas = [];
const ST_CONTA = { pendente: 'Aguardando', aprovado: 'Aprovada', recusado: 'Recusada' };
function aba(oc) {
  $('#sec-oc').hidden = !oc; $('#sec-contas').hidden = oc;
  $('#tab-oc').setAttribute('aria-selected', oc); $('#tab-ct').setAttribute('aria-selected', !oc);
}
$('#tab-oc').onclick = () => aba(true);
$('#tab-ct').onclick = () => aba(false);

async function carregarContas() {
  try { contas = await api('/api/admin/usuarios'); renderContas(); } catch (_) {}
}
function renderContas() {
  const pend = contas.filter((c) => c.status === 'pendente').length;
  $('#badge').textContent = pend ? '(' + pend + ' novo' + (pend > 1 ? 's' : '') + ')' : '';
  $('#contas').innerHTML = contas.length ? contas.map((c) => `
    <article class="item ${c.status === 'pendente' ? 'em_andamento' : c.status === 'aprovado' ? 'resolvida' : 'aberta'}" data-id="${c.id}">
      <header><h3>${esc(c.nome)} · @${esc(c.usuario)}</h3><span class="meta">${data(c.criado_em)}</span></header>
      <div class="meta"><span class="tag">${ST_CONTA[c.status] || esc(c.status)}</span></div>
      <div class="actions" style="margin-top:10px">
        ${c.status !== 'aprovado' ? '<button class="primary ok-c">Aprovar</button>' : ''}
        ${c.status === 'pendente' ? '<button class="no-c">Recusar</button>' : ''}
        ${c.status === 'aprovado' ? '<button class="no-c">Bloquear</button>' : ''}
        <button class="danger del-c">Excluir</button>
      </div>
    </article>`).join('') : '<div class="vazio">Ninguém pediu cadastro ainda.</div>';
  document.querySelectorAll('#contas .item').forEach((el) => {
    const id = el.dataset.id;
    const mudar = async (status) => {
      try { const n = await api('/api/admin/usuarios/' + id, { method: 'PATCH', body: JSON.stringify({ status }) });
        contas = contas.map((c) => String(c.id) === id ? n : c); renderContas(); } catch (err) { alert(err.message); }
    };
    const ok = el.querySelector('.ok-c'), no = el.querySelector('.no-c');
    if (ok) ok.onclick = () => mudar('aprovado');
    if (no) no.onclick = () => mudar('recusado');
    el.querySelector('.del-c').onclick = async () => {
      if (!confirm('Excluir a conta de ' + contas.find((c) => String(c.id) === id).nome + '? As ocorrências dela continuam salvas.')) return;
      await api('/api/admin/usuarios/' + id, { method: 'DELETE' });
      contas = contas.filter((c) => String(c.id) !== id); renderContas();
    };
  });
}

async function atualizar(id, corpo) {
  try {
    const novo = await api('/api/admin/ocorrencias/' + id, { method: 'PATCH', body: JSON.stringify(corpo) });
    dados = dados.map((o) => String(o.id) === String(id) ? { ...o, ...novo } : o); render();
  } catch (err) { alert(err.message); }
}
if (token) abrir();
/* atualiza sozinho a cada 30s, sem mexer se você estiver digitando uma nota */
setInterval(() => {
  if (!token || $('#app').hidden || document.hidden) return;
  if (document.activeElement && document.activeElement.classList.contains('nt')) return;
  carregar(); carregarContas();
}, 30000);
</script>
<script src="/install.js"></script>
</body>
</html>
