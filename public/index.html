<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar ocorrência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0b5fa5">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ENTRAR / CRIAR CONTA -->
<main class="wrap" id="auth">
  <h1>Registrar ocorrência</h1>
  <p class="lead">Entre com seu usuário e senha para enviar uma ocorrência.</p>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-login" aria-selected="true">Entrar</button>
    <button type="button" role="tab" id="tab-cad" aria-selected="false">Cadastrar</button>
  </div>

  <form id="lf" class="card">
    <label for="l-usuario">Usuário</label>
    <input id="l-usuario" autocomplete="username" autocapitalize="none" required>
    <label for="l-senha">Senha</label>
    <input id="l-senha" type="password" autocomplete="current-password" required>
    <button class="primary full">Entrar</button>
    <div id="lmsg" role="status" aria-live="polite"></div>
  </form>

  <form id="cf" class="card" hidden>
    <p class="hint" style="margin:0 0 4px">Depois de se cadastrar, o Caue precisa aprovar sua conta antes de você entrar.</p>
    <label for="c-nome">Seu nome</label>
    <input id="c-nome" autocomplete="name" maxlength="100" required>
    <label for="c-usuario">Escolha um usuário <span class="hint">(3 a 30 letras ou números)</span></label>
    <input id="c-usuario" autocomplete="username" autocapitalize="none" maxlength="30" required>
    <label for="c-senha">Escolha uma senha <span class="hint">(mínimo 6 caracteres)</span></label>
    <input id="c-senha" type="password" autocomplete="new-password" minlength="6" required>
    <button class="primary full">Pedir cadastro</button>
    <div id="cmsg" role="status" aria-live="polite"></div>
  </form>
</main>

<!-- FORMULÁRIO DA OCORRÊNCIA -->
<main class="wrap" id="painel" hidden>
  <div class="top">
    <h1>Registrar ocorrência</h1>
    <div class="actions"><span class="meta" id="ola"></span><button type="button" id="sair">Sair</button></div>
  </div>
  <p class="lead">Conte o que aconteceu. Sua ocorrência é enviada para o Caue na hora.</p>

  <form id="f" class="card" novalidate>
    <div class="row">
      <div><label for="categoria">Categoria</label>
        <select id="categoria" name="categoria" required>
          <option value="">Escolha…</option>
          <option>Segurança</option><option>Manutenção</option><option>Limpeza</option><option>Barulho</option><option>Outros</option>
        </select></div>
      <div><label for="prioridade">Urgência</label>
        <select id="prioridade" name="prioridade">
          <option value="baixa">Baixa</option><option value="media" selected>Média</option><option value="alta">Alta</option>
        </select></div>
    </div>
    <label for="local">Onde aconteceu</label>
    <input id="local" name="local" required maxlength="150" placeholder="Ex.: Bloco B, 2º andar">
    <label for="descricao">O que aconteceu</label>
    <textarea id="descricao" name="descricao" required maxlength="2000"></textarea>
    <label for="contato">Telefone ou e-mail <span class="hint">(opcional)</span></label>
    <input id="contato" name="contato" maxlength="100" autocomplete="email">
    <button class="primary full" id="btn">Enviar ocorrência</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>

  <h2 style="margin-top:28px">Minhas ocorrências</h2>
  <div id="minhas"></div>
</main>

<!-- POP-UP DE CONFIRMAÇÃO -->
<dialog id="popup" class="popup" aria-labelledby="popup-titulo">
  <div class="check" aria-hidden="true">✓</div>
  <h2 id="popup-titulo">Enviada para o Caue</h2>
  <p id="popup-prot" class="meta"></p>
  <button type="button" class="primary" id="popup-ok">OK</button>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS = { aberta: 'Aberta', em_andamento: 'Em andamento', resolvida: 'Resolvida' };
let token = localStorage.getItem('user_tk') || '';

async function api(url, opt = {}) {
  const r = await fetch(url, { ...opt, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) } , });
  const j = r.status === 204 ? null : await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401 && token && !url.startsWith('/api/login')) { sair(); }
    throw new Error((j && j.erro) || 'Algo deu errado. Tente de novo.');
  }
  return j;
}
function sair() {
  token = ''; localStorage.removeItem('user_tk');
  $('#painel').hidden = true; $('#auth').hidden = false;
}
function entrar(j) {
  token = j.token; localStorage.setItem('user_tk', token);
  $('#ola').textContent = 'Olá, ' + j.nome;
  $('#auth').hidden = true; $('#painel').hidden = false;
  carregarMinhas();
}
function msg(el, tipo, texto) { el.className = tipo ? 'msg ' + tipo : ''; el.textContent = texto || ''; }

/* abas */
function aba(login) {
  $('#lf').hidden = !login; $('#cf').hidden = login;
  $('#tab-login').setAttribute('aria-selected', login); $('#tab-cad').setAttribute('aria-selected', !login);
}
$('#tab-login').onclick = () => aba(true);
$('#tab-cad').onclick = () => aba(false);

/* login */
$('#lf').addEventListener('submit', async (e) => {
  e.preventDefault(); msg($('#lmsg'));
  try {
    entrar(await api('/api/login', { method: 'POST', body: JSON.stringify({ usuario: $('#l-usuario').value, senha: $('#l-senha').value }) }));
    $('#l-senha').value = '';
  } catch (err) { msg($('#lmsg'), 'erro', err.message); }
});

/* cadastro: vira um pedido que o Caue precisa aprovar */
$('#cf').addEventListener('submit', async (e) => {
  e.preventDefault(); msg($('#cmsg'));
  try {
    const j = await api('/api/cadastro', { method: 'POST', body: JSON.stringify({ nome: $('#c-nome').value, usuario: $('#c-usuario').value, senha: $('#c-senha').value }) });
    $('#cf').reset(); aba(true);
    $('#l-usuario').value = j.usuario;
    msg($('#lmsg'), 'ok', 'Cadastro enviado! Agora é só esperar o Caue aprovar sua conta. Depois de aprovada, entre aqui com seu usuário e senha.');
  } catch (err) { msg($('#cmsg'), 'erro', err.message); }
});
$('#sair').onclick = sair;

/* enviar ocorrência */
const f = $('#f'), btn = $('#btn'), popup = $('#popup');
f.addEventListener('submit', async (e) => {
  e.preventDefault(); msg($('#msg'));
  const dados = Object.fromEntries(new FormData(f));
  if (!dados.categoria || !dados.local.trim() || !dados.descricao.trim()) {
    return msg($('#msg'), 'erro', 'Preencha categoria, local e descrição.');
  }
  btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    const j = await api('/api/ocorrencias', { method: 'POST', body: JSON.stringify(dados) });
    f.reset();
    $('#popup-prot').textContent = 'Protocolo nº ' + j.protocolo;
    popup.showModal();
    carregarMinhas();
  } catch (err) { msg($('#msg'), 'erro', err.message); }
  finally { btn.disabled = false; btn.textContent = 'Enviar ocorrência'; }
});
$('#popup-ok').onclick = () => popup.close();
popup.addEventListener('click', (e) => { if (e.target === popup) popup.close(); });

/* minhas ocorrências */
async function carregarMinhas() {
  try {
    const lista = await api('/api/minhas');
    $('#minhas').innerHTML = lista.length ? lista.map((o) => `
      <article class="item ${esc(o.status)}">
        <header><h3>#${o.id} · ${esc(o.local)}</h3>
          <span class="meta">${new Date(o.criada_em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}</span></header>
        <div class="meta"><span class="tag">${esc(o.categoria)}</span><span class="tag">${esc(STATUS[o.status] || o.status)}</span></div>
      </article>`).join('') : '<div class="vazio">Você ainda não enviou nenhuma ocorrência.</div>';
  } catch (_) {}
}

/* já estava logado? */
if (token) api('/api/eu').then((u) => entrar({ token, nome: u.nome })).catch(() => {});
</script>
<script src="/install.js"></script>
</body>
</html>
