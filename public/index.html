<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrar ocorrência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0b5fa5">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap">
  <h1>Registrar ocorrência</h1>
  <p class="lead">Conte o que aconteceu. A administração recebe o registro na hora.</p>

  <form id="f" class="card" novalidate>
    <div class="row">
      <div><label for="nome">Seu nome</label><input id="nome" name="nome" required maxlength="100" autocomplete="name"></div>
      <div><label for="contato">Telefone ou e-mail <span class="hint">(opcional)</span></label><input id="contato" name="contato" maxlength="100" autocomplete="email"></div>
    </div>
    <div class="row">
      <div><label for="categoria">Categoria</label>
        <select id="categoria" name="categoria" required>
          <option value="">Escolha…</option>
          <option>Segurança</option><option>Manutenção</option><option>Limpeza</option><option>Barulho</option><option>Outros</option>
        </select></div>
      <div><label for="prioridade">Urgência</label>
        <select id="prioridade" name="prioridade">
          <option value="baixa">Baixa</option><option value="media" selected>Média</option><option value="alta">Alta</option>
        </select></div>
    </div>
    <label for="local">Onde aconteceu</label>
    <input id="local" name="local" required maxlength="150" placeholder="Ex.: Bloco B, 2º andar">
    <label for="descricao">O que aconteceu</label>
    <textarea id="descricao" name="descricao" required maxlength="2000"></textarea>
    <button class="primary full" id="btn">Enviar ocorrência</button>
    <div id="msg" role="status" aria-live="polite"></div>
  </form>
</main>
<script>
const f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('btn');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = ''; msg.textContent = '';
  const dados = Object.fromEntries(new FormData(f));
  if (!dados.nome.trim() || !dados.categoria || !dados.local.trim() || !dados.descricao.trim()) {
    msg.className = 'msg erro'; msg.textContent = 'Preencha nome, categoria, local e descrição.'; return;
  }
  btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    const r = await fetch('/api/ocorrencias', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(dados) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.erro || 'Não foi possível enviar.');
    f.reset();
    msg.className = 'msg ok'; msg.textContent = 'Ocorrência enviada. Protocolo nº ' + j.protocolo + '.';
  } catch (err) {
    msg.className = 'msg erro'; msg.textContent = err.message;
  } finally { btn.disabled = false; btn.textContent = 'Enviar ocorrência'; }
});
</script>
<script src="/install.js"></script>
</body>
</html>
